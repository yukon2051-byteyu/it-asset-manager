# 画面の色の設定（北欧風・トーンを抑えた明るい配色）
# 背景はオフホワイト、アクセントは明るめの青と黄緑

[theme]
base = "light"
backgroundColor = "#FBFBF8"            # 背景：オフホワイト
secondaryBackgroundColor = "#EEF4F8"   # 入力欄などの背景：ごく淡い青
textColor = "#2F3B45"                  # 文字：深いスレートグレー
primaryColor = "#4F93C9"               # ボタン・選択中：明るめの青
linkColor = "#3F7FB3"
borderColor = "#DCE4EA"
dataframeHeaderBackgroundColor = "#EAF3DD"   # 表の見出し：淡い黄緑
baseRadius = "0.6rem"

# お知らせ・成功・注意・エラーの色（原色を避け、彩度を少し落とした色）
blueColor = "#5B9BD0"
blueBackgroundColor = "#E6F0F9"
blueTextColor = "#2F6596"
greenColor = "#8CBF5F"
greenBackgroundColor = "#EEF6E4"
greenTextColor = "#4C7A2A"
yellowColor = "#D9B65C"
yellowBackgroundColor = "#FBF3DC"
yellowTextColor = "#7D6222"
redColor = "#D08A80"
redBackgroundColor = "#FAE8E5"
redTextColor = "#8E4A42"
orangeColor = "#E0A46E"
violetColor = "#A79BC9"
grayColor = "#A3ADB3"

[theme.sidebar]
backgroundColor = "#E8F1F8"            # サイドバー：淡い空色
secondaryBackgroundColor = "#FBFBF8"
